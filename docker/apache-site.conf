# Interview Revision Hub — production vhost.
#
# Plain HTTP only. TLS terminates at Cloudflare and at the CloudForge-managed
# Nginx site; this port is published on 127.0.0.1 and is not reachable from the
# internet.

ServerTokens Prod
ServerSignature Off

RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 127.0.0.1
RemoteIPTrustedProxy 10.0.0.0/8
RemoteIPTrustedProxy 172.16.0.0/12
RemoteIPTrustedProxy 192.168.0.0/16

<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.html index.php

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # THE important rule. .env sits in the document root because api.php and
    # ai_proxy.php both read __DIR__.'/.env', and Apache serves unknown
    # extensions as plain text — so without this, every API key in it is one
    # GET away. Apache's stock config only protects .ht* files.
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>
    <Files ".env">
        Require all denied
    </Files>

    # chat.json and the session store. data/.htaccess also denies this, but
    # that file depends on AllowOverride staying enabled.
    <DirectoryMatch "^/var/www/html/(data|docker)(/|$)">
        Require all denied
    </DirectoryMatch>

    # Documentation in a web root is served verbatim, and DOCUMENTATION.md
    # describes the auth flow and the internal token design.
    <FilesMatch "\.(md|sh|ps1|dist|example|lock)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^(Dockerfile|docker-compose\.ya?ml|Jenkinsfile)$">
        Require all denied
    </FilesMatch>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    ErrorLog /dev/stderr
    # Health polls every 30s and chat long-polls every ~25s; neither is worth a
    # log line, and together they would drown the actual traffic.
    SetEnvIf Request_URI "^/health\.php$" cf_noise
    SetEnvIf Query_String "action=poll" cf_noise
    CustomLog /dev/stdout combined env=!cf_noise
</VirtualHost>
