; Interview Revision Hub — production PHP settings.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED

; The AI service accepts uploads up to MAX_UPLOAD_MB (50 by default) and
; ai_proxy.php forwards them as multipart, so PHP has to accept them first.
; The Nginx site in front needs a matching client_max_body_size.
upload_max_filesize = 50M
post_max_size = 56M
max_file_uploads = 20

memory_limit = 256M

; api.php?action=poll holds a request open for up to 30s, and ai_proxy.php's
; curl timeout for an interview answer is 180s. The default 30s would kill the
; latter mid-call, which surfaces to the user as a blank AI response.
max_execution_time = 300

date.timezone = UTC

session.save_path = "/var/lib/php/sessions"
session.gc_maxlifetime = 86400
session.use_strict_mode = 1
session.cookie_httponly = 1
; The site is served over HTTPS, and this cookie is the whole auth gate.
session.cookie_secure = 1
session.cookie_samesite = "Lax"

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.interned_strings_buffer = 16
; Each deploy is a new image, so file timestamps cannot change underneath a
; running container.
opcache.validate_timestamps = 0
