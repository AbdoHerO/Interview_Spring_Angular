version: "3.9"

# Stand-alone stack for the AI interview service.
# Run from ./ai-service:  docker compose up -d
# Then point the PHP proxy (ai_proxy.php) at http://ai:8088

services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ai:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    ports:
      - "8088:8088"
    volumes:
      - ./data:/srv/data   # session JSON files

volumes:
  qdrant_data:
